<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Отчёты руководителю</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e6e8eb;--line2:#d3d7dc;--accent:#1c6ea4;--track:#eef0f3}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1e2126;--ink:#e8eaed;--muted:#9aa0a6;--line:#2c2f36;--line2:#3a3e46;--accent:#4aa3d6;--track:#282c33}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;max-width:340px;width:100%;text-align:center}
h1{font-size:16px;margin:0 0 4px}#gate p{font-size:12px;color:var(--muted);margin:0 0 16px}
#rem{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:10px;cursor:pointer}
input{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line2);border-radius:8px;background:transparent;color:inherit}
button.go{margin-top:10px;width:100%;padding:10px;font-size:14px;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.err{color:#c5372c;font-size:12px;margin-top:8px;min-height:14px}
#app{display:none;height:100%;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line2);background:var(--card)}
#bar .ttl{font-size:12px;font-weight:700;margin-right:2px}
.tabs{display:inline-flex;gap:2px;background:var(--track);border-radius:9px;padding:3px}
.mtab{border:0;background:transparent;color:var(--muted);font:600 12px/1 inherit;padding:7px 14px;border-radius:7px;cursor:pointer;font-family:inherit}
.mtab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.10)}
.mtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#frame{flex:1;width:100%;border:0;display:block}
</style></head><body>
<div id="gate"><div class="box"><h1>Отчёты руководителю</h1><p>Введите пароль — он один для всех месяцев</p>
<input id="pw" type="password" placeholder="Пароль" autofocus onkeydown="if(event.key==='Enter')go()">
<button class="go" onclick="go()">Открыть</button>
<label id="rem"><input type="checkbox" id="remember"> запомнить на этом устройстве</label>
<div class="err" id="err"></div></div></div>
<div id="app"><div id="bar"><span class="ttl">Отчёт руководителю</span><div class="tabs" id="tabs"></div></div>
<iframe id="frame" title="Отчёт за выбранный месяц" allow="clipboard-write"></iframe></div>

function d(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
function show(i){
  document.getElementById('frame').srcdoc=M[i].html;
  var t=document.getElementById('tabs').children;
  for(var j=0;j<t.length;j++)t[j].classList.toggle('on',j===i);
}
var KEY='bolotov-reports-pw';
async function unlock(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(V)},k,d(C));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function go(){
  var pw=document.getElementById('pw').value,e=document.getElementById('err');e.textContent='';
  try{ M=await unlock(pw); }catch(err){e.textContent='Неверный пароль';return}
  try{ var cb=document.getElementById('remember');
       if(cb&&cb.checked) localStorage.setItem(KEY,pw); else localStorage.removeItem(KEY); }catch(x){}

  M.forEach(function(m,i){
    var b=document.createElement('button');
    b.className='mtab';b.textContent=m.label;b.onclick=function(){show(i)};
    tabs.appendChild(b);
  });
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='flex';
  show(0);
}
// Пароль, сохранённый на ЭТОМ устройстве (галочка при входе): открываем сразу. Не подошёл —
// забываем и показываем форму, как будто ничего не было. На публичную страницу это не влияет:
// шифротекст тот же, ключ лежит только в браузере владелицы.
(async function(){
  var pw=null; try{ pw=localStorage.getItem(KEY); }catch(x){}
  if(!pw) return;
  try{ M=await unlock(pw); }catch(err){ try{localStorage.removeItem(KEY);}catch(x){} return; }
  var cb=document.getElementById('remember'); if(cb) cb.checked=true;
  var tabs=document.getElementById('tabs');
  M.forEach(function(m,i){
    var b=document.createElement('button');
    b.className='mtab';b.textContent=m.label;b.onclick=function(){show(i)};

  });
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='flex';
  show(0);
})();
